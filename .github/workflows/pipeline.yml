name: multi-stage-demo
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building the application v2..."

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running unit tests..."

  deploy-dev:
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "Deploying to Dev"

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Deploying to Prod"
